[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contest-mcp"
version = "0.1.0"
description = "한국 공모전·대외활동을 수집해 조회하는 MCP 서버 (위비티·씽굿·올콘)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "JEONG KITAE" }]
keywords = ["mcp", "contest", "korea", "공모전", "wevity", "thinkgood", "allcon"]
dependencies = ["mcp>=1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
contest-mcp = "contest_mcp.server:main"
contest = "contest_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/mytrashcan/contest-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/contest_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
